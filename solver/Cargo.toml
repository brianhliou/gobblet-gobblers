[package]
name = "gobblet-solver"
version = "0.1.0"
edition = "2021"

# Retrograde solver — the canonical tablebase builder. Cuts the .ctb consumed
# by the API probe. See README for usage.
[[bin]]
name = "retro"
path = "src/bin/retro.rs"

# Analysis / inspection tools (read-only over the game graph).
[[bin]]
name = "count_tree"
path = "src/bin/count_tree.rs"

[[bin]]
name = "stats"
path = "src/bin/stats.rs"

[[bin]]
name = "render"
path = "src/bin/render.rs"

[dependencies]
gobblet-core = { path = "../core" }
rayon = "1"          # parallel retrograde fixpoint
boomphf = { version = "0.6.0", features = ["serde"] }  # minimal perfect hash for the compact .ctb
bincode = "1"        # serialize the MPH
serde = { version = "1", features = ["derive"] }
ctrlc = "3.4"        # SIGINT handling (count_tree)
