[package]
name = "gobblet-api"
version = "0.1.0"
edition = "2021"
description = "Gobblet Gobblers tablebase probe (compact MPH .ctb, served over HTTP)"
license = "MIT"

[dependencies]
gobblet-core = { path = "../gobblet-core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["cors", "timeout"] }
boomphf = { version = "0.6.0", features = ["serde"] }
bincode = "1"
